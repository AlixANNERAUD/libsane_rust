[package]
name = "libsane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Safe, idiomatic bindings to SANE (Scanner Access Now Easy): list scanners, set options and scan"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/libsane"
readme = "README.md"
keywords = ["sane", "scanner", "scan", "image", "document"]
categories = ["api-bindings", "hardware-support", "multimedia::images"]
include = ["/src/**", "/tests/**", "/examples/**", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[features]
## Converts scanned frames to `image::DynamicImage`.
image = ["dep:image"]

[dependencies]
sane-sys.workspace = true
image = { version = "0.25", default-features = false, optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "scan_to_png"
required-features = ["image"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

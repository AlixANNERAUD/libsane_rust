name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: release
      - run: mise run test
      - run: mise run package

  release-plz-release:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      # Publishing builds each crate from its package: sane-sys needs libsane.
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      # The semver check builds the documentation: libclang for bindgen.
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - name: Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

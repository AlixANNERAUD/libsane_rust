[package]
name = "sane-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
links = "sane"
description = "Raw FFI bindings to libsane, the SANE (Scanner Access Now Easy) scanner API, generated with bindgen and linked through pkg-config"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sane-sys"
readme = "README.md"
keywords = ["sane", "scanner", "scanning", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support", "os::unix-apis"]
# `include/` holds a copy of sane.h, used only on docs.rs (see build.rs).
include = ["/build.rs", "/wrapper.h", "/include/**", "/src/**", "/tests/**", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3.30"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
